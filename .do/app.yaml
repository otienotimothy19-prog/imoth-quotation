# DigitalOcean App Platform spec for this repo -- kept in sync with the
# live spec for the "quotation-app" app (quotes.imoth.co.ke) as a
# version-controlled reference. The dashboard's "Edit App Spec" is the
# actual source of truth; re-sync this file here after any live change.
#
# Why the repo needs an explicit spec at all: it's a monorepo with no
# root-level package.json / Dockerfile -- everything buildable lives
# under backend/ (FastAPI, Python buildpack) and frontend/ (Vite, Node
# buildpack + static site) as two separate components. Without an
# explicit source_dir per component, App Platform's buildpack detection
# has nothing to build at the repo root and the build job fails with a
# generic non-zero exit -- this is exactly what happened before this
# file existed.
#
# Both components share one app/domain with path-based ingress routing
# (/api -> backend service, everything else -> the built frontend), so
# the frontend calls the API with a relative "/api" base URL and there
# is no cross-origin request to configure.
#
# catchall_document on the frontend static site is required: it's a
# client-side-routed React app, so any direct visit/refresh on a route
# like /admin/login 404s unless the host falls back to index.html for
# unmatched paths.
#
# The backend's run_command runs the seed script (idempotent -- safe to
# re-run every deploy) after migrations, because a bare `alembic upgrade
# head` only creates empty tables: no insurers, no rate data, no admin
# login. Without the seed step the app deploys successfully but is
# completely unusable.
#
# DATABASE_URL uses App Platform's bindable reference syntax
# (${<db-component-name>.DATABASE_URL}) tied to the linked database
# resource below, rather than a manually pasted connection string --
# it always resolves to the current, correct value and needs no
# maintenance. Do not point it at a database another app already uses;
# this app has its own dedicated `imoth_quotation` database on the
# shared cluster.
#
# How to apply changes made here:
#   1. Dashboard: Apps -> quotation-app -> Settings -> App Spec -> Edit,
#      paste this file's contents, review the diff, save. DO will
#      prompt for any SECRET-type env values that aren't already set --
#      only use the full App Spec editor for this, not a per-component
#      Settings page, which has been observed to silently drop fields
#      (source_dir/environment_slug/build_command, the whole
#      static_sites block) that aren't shown on that simplified page.
#   2. Or via doctl: doctl apps update <app-id> --spec .do/app.yaml
#
# Update owner/repo below if this app is ever deployed from a fork.

alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- cluster_name: db-pgsql-blr1-48771
  db_name: imoth_quotation
  db_user: doadmin
  engine: PG
  name: db-pgsql-blr1-48771
  production: true
  version: "18"
domains:
- domain: quotes.imoth.co.ke
  type: PRIMARY
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: imoth-quotation
    match:
      authority:
        exact: ""
      path:
        prefix: /api
  - component:
      name: frontend
    match:
      authority:
        exact: ""
      path:
        prefix: /
maintenance: {}
name: quotation-app
region: blr
services:
- build_command: pip install -r requirements.txt
  environment_slug: python
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db-pgsql-blr1-48771.DATABASE_URL}
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: ENVIRONMENT
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: CORS_ORIGINS
    scope: RUN_TIME
    value: https://quotes.imoth.co.ke
  - key: STORAGE_BACKEND
    scope: RUN_TIME
    value: local
  - key: STORAGE_LOCAL_PATH
    scope: RUN_TIME
    value: ./storage/documents
  - key: BOOTSTRAP_ADMIN_EMAIL
    scope: RUN_TIME
    value: admin@imoth.co.ke
  - key: BOOTSTRAP_ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET
  github:
    branch: main
    deploy_on_push: true
    repo: otienotimothy19-prog/imoth-quotation
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  name: imoth-quotation
  run_command: alembic upgrade head && python -m app.seed.seed_data && uvicorn app.main:app
    --host 0.0.0.0 --port 8080
  source_dir: backend
static_sites:
- build_command: npm ci && npm run build
  catchall_document: index.html
  envs:
  - key: VITE_API_BASE_URL
    scope: BUILD_TIME
  github:
    branch: main
    deploy_on_push: true
    repo: otienotimothy19-prog/imoth-quotation
  name: frontend
  output_dir: dist
  source_dir: frontend
